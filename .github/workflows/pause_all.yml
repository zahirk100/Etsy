name: Pause all active campaigns

# Manual trigger only -- a deliberate stop-spend action (e.g. retooling
# product sourcing/strategy), separate from the guardrail-driven pausing
# `monitor` does on its own schedule.
on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: dropship-state
  cancel-in-progress: false

jobs:
  pause-all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pause-all
        env:
          SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
          SHOPIFY_ADMIN_API_TOKEN: ${{ secrets.SHOPIFY_ADMIN_API_TOKEN }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          SHOPIFY_PUBLIC_DOMAIN: ${{ vars.SHOPIFY_PUBLIC_DOMAIN }}
          DROPSHIP_STORE_FACTS: ${{ vars.DROPSHIP_STORE_FACTS }}
          DROPSHIP_TARGET_COUNTRY: ${{ vars.DROPSHIP_TARGET_COUNTRY }}
          DROPSHIP_STARTING_DAILY_BUDGET_USD: ${{ vars.DROPSHIP_STARTING_DAILY_BUDGET_USD }}
          DROPSHIP_DAILY_BUDGET_CAP_USD: ${{ vars.DROPSHIP_DAILY_BUDGET_CAP_USD }}
          DROPSHIP_MAX_TOTAL_DAILY_BUDGET_USD: ${{ vars.DROPSHIP_MAX_TOTAL_DAILY_BUDGET_USD }}
          DROPSHIP_TARGET_ACTIVE_CAMPAIGNS: ${{ vars.DROPSHIP_TARGET_ACTIVE_CAMPAIGNS }}
          DROPSHIP_KILL_SPEND_NO_SALE_USD: ${{ vars.DROPSHIP_KILL_SPEND_NO_SALE_USD }}
          DROPSHIP_HARD_STOP_SPEND_NO_SALE_USD: ${{ vars.DROPSHIP_HARD_STOP_SPEND_NO_SALE_USD }}
          DROPSHIP_PAUSE_CPA_USD: ${{ vars.DROPSHIP_PAUSE_CPA_USD }}
          FACEBOOK_AD_ACCOUNT_ID: ${{ secrets.FACEBOOK_AD_ACCOUNT_ID }}
          FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PIXEL_ID: ${{ secrets.FACEBOOK_PIXEL_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m dropship_bot.cli pause-all

      - name: Commit updated campaign state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in .dropship_state.json .dropship_learnings.json; do
            [ -f "$f" ] && git add "$f"
          done
          git diff --cached --quiet || git commit -m "Pause all active campaigns [skip ci]"
          git pull --rebase --autostash && git push
