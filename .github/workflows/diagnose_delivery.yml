name: Diagnose ad delivery

# Manual trigger only. Read-only against Facebook -- for every ACTIVE
# campaign in state, prints campaign/adset/ad status + effective_status +
# any review issues, so a campaign stuck at $0 spend long after being
# activated can be diagnosed (ad review, disapproval, account-level block)
# instead of guessing.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  diagnose-delivery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run diagnose-delivery
        env:
          SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
          SHOPIFY_ADMIN_API_TOKEN: ${{ secrets.SHOPIFY_ADMIN_API_TOKEN }}
          FACEBOOK_AD_ACCOUNT_ID: ${{ secrets.FACEBOOK_AD_ACCOUNT_ID }}
          FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PIXEL_ID: ${{ secrets.FACEBOOK_PIXEL_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m dropship_bot.cli diagnose-delivery
