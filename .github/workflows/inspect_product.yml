name: Inspect a store product

# Manual trigger only. Read-only against the live Shopify store -- fetches
# and prints one product's full detail (title, description, images, price)
# so it can be reviewed/improved. No side effects, nothing written back.
on:
  workflow_dispatch:
    inputs:
      query:
        description: "Substring to match in the product title"
        required: true

permissions:
  contents: read

jobs:
  inspect-product:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run inspect-product
        env:
          SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
          SHOPIFY_ADMIN_API_TOKEN: ${{ secrets.SHOPIFY_ADMIN_API_TOKEN }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          SHOPIFY_PUBLIC_DOMAIN: ${{ vars.SHOPIFY_PUBLIC_DOMAIN }}
          DROPSHIP_STORE_FACTS: ${{ vars.DROPSHIP_STORE_FACTS }}
          DROPSHIP_TARGET_COUNTRY: ${{ vars.DROPSHIP_TARGET_COUNTRY }}
          DROPSHIP_STARTING_DAILY_BUDGET_USD: ${{ vars.DROPSHIP_STARTING_DAILY_BUDGET_USD }}
          DROPSHIP_DAILY_BUDGET_CAP_USD: ${{ vars.DROPSHIP_DAILY_BUDGET_CAP_USD }}
          DROPSHIP_MAX_TOTAL_DAILY_BUDGET_USD: ${{ vars.DROPSHIP_MAX_TOTAL_DAILY_BUDGET_USD }}
          DROPSHIP_TARGET_ACTIVE_CAMPAIGNS: ${{ vars.DROPSHIP_TARGET_ACTIVE_CAMPAIGNS }}
          DROPSHIP_KILL_SPEND_NO_SALE_USD: ${{ vars.DROPSHIP_KILL_SPEND_NO_SALE_USD }}
          DROPSHIP_HARD_STOP_SPEND_NO_SALE_USD: ${{ vars.DROPSHIP_HARD_STOP_SPEND_NO_SALE_USD }}
          DROPSHIP_PAUSE_CPA_USD: ${{ vars.DROPSHIP_PAUSE_CPA_USD }}
        run: python -m dropship_bot.cli inspect-product --query "${{ inputs.query }}"
