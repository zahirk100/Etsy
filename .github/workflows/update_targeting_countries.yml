name: Update targeting countries

# Manual trigger only. Replaces the geo targeting on every campaign in
# state whose current country list contains a given country (default AU)
# with a new list (default config.TARGET_COUNTRY) -- updates the
# already-created Facebook adsets directly, not just future launches. Use
# this when a country turns out to require ad-account verification that
# won't be completed (e.g. AU asking for extra documents beyond a
# passport).
on:
  workflow_dispatch:
    inputs:
      drop:
        description: "Comma-separated country code(s) to look for and remove"
        required: false
        default: "AU"
      countries:
        description: "New comma-separated country list (blank = config.TARGET_COUNTRY)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  update-targeting-countries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run update-targeting-countries
        env:
          SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
          SHOPIFY_ADMIN_API_TOKEN: ${{ secrets.SHOPIFY_ADMIN_API_TOKEN }}
          FACEBOOK_AD_ACCOUNT_ID: ${{ secrets.FACEBOOK_AD_ACCOUNT_ID }}
          FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PIXEL_ID: ${{ secrets.FACEBOOK_PIXEL_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          INPUT_DROP: ${{ inputs.drop }}
          INPUT_COUNTRIES: ${{ inputs.countries }}
        run: |
          ARGS=(--drop "$INPUT_DROP")
          if [ -n "$INPUT_COUNTRIES" ]; then
            ARGS+=(--countries "$INPUT_COUNTRIES")
          fi
          python -m dropship_bot.cli update-targeting-countries "${ARGS[@]}"

      - name: Commit updated campaign state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in .dropship_state.json .dropship_learnings.json; do
            [ -f "$f" ] && git add "$f"
          done
          git diff --cached --quiet || git commit -m "Update targeting countries [skip ci]"
          git push
