name: Launch campaigns for existing products

# Manual trigger only -- launching new campaigns should be a deliberate
# action, unlike `monitor` which is safe to run on a schedule.
on:
  workflow_dispatch:
    inputs:
      top_n:
        description: "How many products to launch/refresh campaigns for"
        required: false
        default: "3"

permissions:
  contents: write

jobs:
  launch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run launch-existing
        env:
          SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
          SHOPIFY_ADMIN_API_TOKEN: ${{ secrets.SHOPIFY_ADMIN_API_TOKEN }}
          FACEBOOK_AD_ACCOUNT_ID: ${{ secrets.FACEBOOK_AD_ACCOUNT_ID }}
          FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PIXEL_ID: ${{ secrets.FACEBOOK_PIXEL_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m dropship_bot.cli launch-existing --top-n "${{ inputs.top_n }}"

      - name: Commit updated campaign state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f .dropship_state.json ]; then
            git add .dropship_state.json
            git diff --cached --quiet || git commit -m "Launch campaigns [skip ci]"
            git push
          else
            echo "No .dropship_state.json yet -- nothing to commit."
          fi
